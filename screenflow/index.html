<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spatial Log Screenflow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-height canvas app — top bar with tabs, zoomable SVG canvas, right detail panel. Nodes are real screenshots. */
:root{
  --paper:#f2f2f2; --frame:#ffffff; --ink:#1a1a1a; --ink2:#6b6b6b; --line:#c6c6c6; --fill:#e6e6e6; --fill2:#d3d3d3; --dark:#262626; --on-dark:#ffffff; --band:#e9e9e9; --accent:#1a1a1a;
  --ok:#2f7d4f; --part:#b26a00; --plan:#6d6a63; --edge:#8c8c8c; --edge2:#bababa; --hi:#1d5fd1; --hi2:#c2410c; --band2:#efefef;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#1a1a1a; --frame:#262626; --ink:#ececec; --ink2:#a3a3a3; --line:#595959; --fill:#333333; --fill2:#454545; --dark:#e6e6e6; --on-dark:#1a1a1a; --band:#212121; --accent:#ececec; --ok:#6fc08f; --part:#e2a04a; --plan:#a4a19a; --edge:#8c8c8c; --edge2:#5e5e5e; --hi:#6ea2ff; --hi2:#fb923c; --band2:#1e1e1e; color-scheme:dark } }
:root[data-theme="dark"]{ --paper:#1a1a1a; --frame:#262626; --ink:#ececec; --ink2:#a3a3a3; --line:#595959; --fill:#333333; --fill2:#454545; --dark:#e6e6e6; --on-dark:#1a1a1a; --band:#212121; --accent:#ececec; --ok:#6fc08f; --part:#e2a04a; --plan:#a4a19a; --edge:#8c8c8c; --edge2:#5e5e5e; --hi:#6ea2ff; --hi2:#fb923c; --band2:#1e1e1e; color-scheme:dark }
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--frame)}
.top h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--ink2);max-width:900px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tabs button{font:inherit;font-size:12.5px;padding:6px 12px;border:1px solid var(--line);background:var(--frame);color:var(--ink);border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.tabs button:focus-visible,.ctl button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.stage{position:relative;flex:1;min-height:0}
svg.canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg.canvas.grabbing{cursor:grabbing}
.ctl{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:6px}
.ctl button{font:inherit;font-size:13px;width:32px;height:32px;border:1px solid var(--line);background:var(--frame);color:var(--ink);border-radius:6px;cursor:pointer}
.ctl button.wide{width:auto;padding:0 10px;font-size:12px}
.legend{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--frame);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--ink2);display:grid;grid-template-columns:auto auto;gap:4px 10px;align-items:center}
.legend svg{width:28px;height:12px;display:block}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 10px}
.panel{position:absolute;top:0;right:0;height:100%;width:min(420px,100%);background:var(--frame);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.06);padding:18px max(16px,env(safe-area-inset-right,0px)) 18px 18px;overflow:auto;box-sizing:border-box;transform:translateX(100%);transition:transform .2s}
.panel.open{transform:none}
@media (prefers-reduced-motion: reduce){.panel{transition:none}}
.panel h2{font-size:17px;margin:0 0 4px;font-weight:600;padding-right:32px}
.panel .meta{font-size:12px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.panel .meta span{border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.panel .meta span.st-ok{color:var(--ok);border-color:var(--ok)} .panel .meta span.st-part{color:var(--part);border-color:var(--part)} .panel .meta span.st-plan{color:var(--plan);border-style:dashed}
.panel h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:16px 0 6px;font-weight:600}
.panel p,.panel li{font-size:13px;line-height:1.5;margin:0}
.panel ul{padding-left:18px;margin:0}
.panel .close{position:absolute;top:12px;right:12px;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--frame);color:var(--ink);border-radius:6px;width:28px;height:28px;cursor:pointer}
.panel .exit{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--fill)}
.panel .exit b{font-weight:500}
.panel .exit button{font:inherit;font-size:12px;color:var(--ink);background:none;border:none;text-decoration:underline;cursor:pointer;padding:0;text-align:right}
.panel .shot{width:100%;aspect-ratio:16/10;border:1px solid var(--line);border-radius:6px;object-fit:cover;display:block;background:var(--fill);cursor:zoom-in}
.panel .shot.none{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);cursor:default}
.panel .variants{display:flex;gap:4px;margin:8px 0 0}
.panel .variants button{font:inherit;font-size:11.5px;padding:3px 9px;border:1px solid var(--line);background:var(--frame);color:var(--ink);border-radius:999px;cursor:pointer}
.panel .variants button[aria-pressed="true"]{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img{max-width:96vw;max-height:94vh;border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
text{font-family:var(--sans)}
.scr{cursor:pointer}
.scr:hover .frame{stroke:var(--ink)}
.scr.sel .frame{stroke:var(--hi);stroke-width:2.5}
.scr.near .frame{stroke:var(--hi);stroke-width:1.8;stroke-dasharray:none}
.scr.peek .frame{stroke:var(--hi2);stroke-width:3}
.scr,.edge,.pill{transition:opacity .15s}
.focus .scr.dim{opacity:.28} .focus .edge.dim{opacity:.15} .focus .pill.dim{opacity:.12}
.edge.on.out path{stroke:var(--hi);stroke-width:1.8} .edge.on.out circle{fill:var(--hi)}
.edge.on.in path{stroke:var(--hi2);stroke-width:1.6} .edge.on.in circle{fill:var(--hi2)}
.pill.on rect{stroke-width:1.2} .pill.on.out rect{stroke:var(--hi)} .pill.on.in rect{stroke:var(--hi2)}
.pill.on text{font-weight:600} .pill.on.out text{fill:var(--hi)} .pill.on.in text{fill:var(--hi2)}
</style>
</head><body>
<header class="top">
  <div>
    <h1>Spatial Log · SAMS 화면설계도 — 구현 캡처</h1>
    <div class="sub" id="hint">Depth 1–5 · 화면은 실제 스크린샷(1440×900) · 2026-10-19 기준</div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
</header>
<div class="stage">
  <svg class="canvas" id="cv" role="img" aria-label="화면 흐름도 캔버스"></svg>
  <div class="ctl">
    <button id="zin" title="확대">+</button><button id="zout" title="축소">−</button><button id="fit" class="wide" title="전체 보기">전체</button>
  </div>
  <div class="legend">
    <svg viewBox="0 0 28 12"><rect x="1" y="1" width="26" height="10" rx="2" fill="none" stroke="currentColor"/></svg><span>화면 (라우트)</span>
    <svg viewBox="0 0 28 12"><rect x="1" y="1" width="26" height="10" rx="2" fill="none" stroke="currentColor" stroke-dasharray="3 2"/></svg><span>오버레이 상태 (모달·드로어·뷰어)</span>
    <svg viewBox="0 0 28 12"><line x1="1" y1="6" x2="24" y2="6" stroke="currentColor" stroke-width="1"/><path d="M22 3l5 3-5 3z" fill="currentColor"/></svg><span>전환 (트리거 액션)</span>
    <svg viewBox="0 0 28 12"><line x1="1" y1="6" x2="24" y2="6" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M22 3l5 3-5 3z" fill="currentColor"/></svg><span>뒤로 · 닫기 · 취소</span>
    <span><i style="background:var(--ok)"></i><i style="background:var(--part)"></i><i style="background:var(--plan)"></i></span><span>구현 · 부분 · 미구현</span>
    <svg viewBox="0 0 28 12"><line x1="1" y1="6" x2="24" y2="6" stroke="var(--hi)" stroke-width="1.8"/><path d="M22 3l5 3-5 3z" fill="var(--hi)"/></svg><span>선택한 화면에서 나감</span>
    <svg viewBox="0 0 28 12"><line x1="1" y1="6" x2="24" y2="6" stroke="var(--hi2)" stroke-width="1.6"/><path d="M22 3l5 3-5 3z" fill="var(--hi2)"/></svg><span>선택한 화면으로 들어옴</span>
  </div>
  <aside class="panel" id="panel" aria-live="polite">
    <button class="close" id="pclose" aria-label="닫기">×</button>
    <div id="pbody"></div>
  </aside>
</div>
<div class="lightbox" id="lb"><img id="lbimg" alt=""></div>

/* ───────── 렌더 ───────── */
const W=320, H=200, COLW=620, ROWH=330, PAD_X=44, PAD_Y=150, GAP=ROWH-H-56; // GAP: 캡션 아래 빈 띠(연결선 레인)
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const T=(x,y,t,o={})=>`<text x="${x}" y="${y}" font-size="${o.fs||7}" fill="${o.fill||'var(--ink2)'}" text-anchor="${o.a||'start'}" font-weight="${o.fw||400}" dominant-baseline="${o.db||'auto'}">${esc(t)}</text>`;
const R=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx??2}" fill="${o.fill||'var(--fill)'}" stroke="${o.stroke||'none'}" stroke-width="${o.sw||1}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} ${o.op?`opacity="${o.op}"`:''}/>`;
const stColor=s=>({ok:'var(--ok)',part:'var(--part)',plan:'var(--plan)'})[s.status]||'var(--ink2)';

function screenSvg(s){
  const shot=s.shots[0]; const src=shot&&IMG[shot.c];
  if(src) return `<image href="${src}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="xMidYMid slice"/>`;
  // 캡처 없음: 오버레이면 바탕 화면을 흐리게 깔고 안내
  let o=R(0,0,W,H,{fill:'var(--fill)',rx:0});
  if(s.overlay){ const b=BY[s.base]; const bs=b.shots[0]&&IMG[b.shots[0].c]; if(bs) o+=`<image href="${bs}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="xMidYMid slice" opacity=".28"/>`; }
  const boxW=200, boxH=84, bx=(W-boxW)/2, by=(H-boxH)/2;
  o+=R(bx,by,boxW,boxH,{fill:'var(--frame)',stroke:'var(--ink2)',dash:s.status==='plan'?'5 4':'',rx:6});
  o+=T(W/2,by+30,s.status==='plan'?'미구현':'스크린샷 미갱신',{a:'middle',fs:12,fw:600,fill:'var(--ink)'});
  o+=T(W/2,by+52,s.status==='plan'?'설계만 확정됨':'캡쳐 예정',{a:'middle',fs:9,fill:'var(--ink2)'});
  return o;
}

function layoutTab(tab){
  const ids=new Set(tab.ids); const list=S.filter(s=>ids.has(s.id));
  const depths=[...new Set(list.map(s=>s.depth))].sort((a,b)=>a-b);
  const colX={}; depths.forEach((d,i)=> colX[d]=PAD_X+i*COLW);
  const pos={}; let y=PAD_Y; const bands=[];
  AREAS.forEach(ar=>{
    const inArea=list.filter(s=>s.area===ar.id); if(!inArea.length) return;
    const perCol={}; inArea.forEach(s=>{ (perCol[s.depth]=perCol[s.depth]||[]).push(s); });
    const rowsN=Math.max(...Object.values(perCol).map(a=>a.length));
    Object.entries(perCol).forEach(([d,arr])=> arr.forEach((s,i)=> pos[s.id]={x:colX[d],y:y+i*ROWH}));
    bands.push({area:ar,y0:y,h:rowsN*ROWH});
    y+=rowsN*ROWH;
  });
  return {list,depths,colX,pos,bands,totalH:y,totalW:PAD_X+depths.length*COLW};
}

function buildEdges(tab,L){
  const ids=new Set(tab.ids); const edges=[];
  L.list.forEach(s=> s.exits.forEach(e=>{ if(!ids.has(e.t)) return; if(tab.ovOnly && !e.ov) return; edges.push({from:s.id,to:e.t,a:e.a,back:!!e.back,ovl:!!BY[e.t].overlay}); }));
  return edges;
}

function routeEdges(edges,L){
  const P=L.pos;
  const counts={}; edges.forEach(e=>{ const a=P[e.from],b=P[e.to]; const k= a.x===b.x? 'c'+a.x : 'g'+Math.min(a.x,b.x)+'-'+Math.max(a.x,b.x); counts[k]=(counts[k]||0)+1; });
  const idx={};
  const colsBetween=(x1,x2)=> Math.round(Math.abs(x2-x1)/COLW);
  edges.forEach(e=>{
    const a=P[e.from], b=P[e.to];
    const k= a.x===b.x? 'c'+a.x : 'g'+Math.min(a.x,b.x)+'-'+Math.max(a.x,b.x); idx[k]=(idx[k]||0)+1; const off=(idx[k]-(counts[k]+1)/2)*12;
    const gutter=(COLW-W);
    let pts;
    if(b.x>a.x){
      const sy=a.y+H/2+off*0.6, ty=b.y+H/2+off*0.6;
      if(colsBetween(a.x,b.x)===1){ const gx=a.x+W+gutter/2+off; pts=[[a.x+W,sy],[gx,sy],[gx,ty],[b.x,ty]]; }
      else { // 여러 열을 건널 때: 첫 거터에서 캡션 아래 레인으로 내려가 지나간 뒤 마지막 거터에서 올라간다
        const g1=a.x+W+gutter/2+off, g2=b.x-gutter/2+off, lane=a.y+H+56+GAP/2+off;
        pts=[[a.x+W,sy],[g1,sy],[g1,lane],[g2,lane],[g2,ty],[b.x,ty]]; }
    } else if(b.x<a.x){
      const sy=a.y+H/2+off*0.6, ty=b.y+H/2+off*0.6;
      if(colsBetween(a.x,b.x)===1){ const gx=b.x+W+gutter/2+off; pts=[[a.x,sy],[gx,sy],[gx,ty],[b.x+W,ty]]; }
      else { const g1=a.x-gutter/2+off, g2=b.x+W+gutter/2+off, lane=a.y+H+56+GAP/2+off; pts=[[a.x,sy],[g1,sy],[g1,lane],[g2,lane],[g2,ty],[b.x+W,ty]]; }
    } else { const down=b.y>a.y; const sx=a.x+W/2+off, tx=b.x+W/2+off;
      if(down){ pts=[[sx,a.y+H+56],[sx,b.y]]; }
      else { const gx=a.x+W+30+off; pts=[[a.x+W,a.y+H/2+off*0.6],[gx,a.y+H/2+off*0.6],[gx,b.y+H/2+off*0.6],[b.x+W,b.y+H/2+off*0.6]]; } }
    e.pts=pts.filter((p,i)=> i===0 || p[0]!==pts[i-1][0] || p[1]!==pts[i-1][1]);
    // 라벨: 거터의 세로 세그먼트 중앙(노드 사이 빈 공간)을 우선, 없으면 가장 긴 세그먼트
    let best=null; for(let i=0;i<e.pts.length-1;i++){ const [x1,y1]=e.pts[i],[x2,y2]=e.pts[i+1]; const len=Math.hypot(x2-x1,y2-y1); const vert=x1===x2; const score=len+(vert?500:0); if(!best||score>best.score) best={score,x:(x1+x2)/2,y:(y1+y2)/2,vert,len}; }
    e.lx=best.x; e.ly=best.y; e.lw=Math.min(e.a.length*5.6+22, 210);
  });
  for(let pass=0;pass<10;pass++){ let moved=false; for(let i=0;i<edges.length;i++) for(let j=i+1;j<edges.length;j++){ const p=edges[i],q=edges[j]; const ox=(p.lw+q.lw)/2+4-Math.abs(p.lx-q.lx), oy=22-Math.abs(p.ly-q.ly); if(ox>0&&oy>0){ if(p.ly<=q.ly){p.ly-=11;q.ly+=11;} else {p.ly+=11;q.ly-=11;} moved=true; } } if(!moved) break; }
  const boxes=L.list.map(s=>({x:L.pos[s.id].x,y:L.pos[s.id].y,w:W,h:H+46}));
  edges.forEach(e=>{ boxes.forEach(b=>{ if(e.lx-e.lw/2<b.x+b.w+4 && e.lx+e.lw/2>b.x-4 && e.ly-10<b.y+b.h+4 && e.ly+10>b.y-4){ // 노드 위에 올라가면 가까운 거터로 민다
        const left=b.x-4-e.lw/2, right=b.x+b.w+4+e.lw/2; e.lx= Math.abs(e.lx-left)<Math.abs(e.lx-right)? left : right; } }); });
  return edges;
}

TABS.forEach(t=>{ const b=document.createElement('button'); b.textContent=t.name; b.setAttribute('role','tab'); b.id='tab-'+t.id; b.onclick=()=>{ cur=t; selected=null; closePanel(); draw(); fit(); try{localStorage.setItem('sls-tab',t.id)}catch(e){} }; tabsEl.appendChild(b); });

function draw(){
  TABS.forEach(t=> document.getElementById('tab-'+t.id).setAttribute('aria-selected', t===cur));
  document.getElementById('hint').textContent=cur.note+'  ·  드래그 이동 · 휠 확대 · 화면 클릭 상세 · 더블클릭 전체';
  const L=layoutTab(cur); cur.L=L;
  const edges=routeEdges(buildEdges(cur,L),L);
  let o=`<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--edge)"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--edge2)"/></marker><marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--hi)"/></marker><marker id="arh2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--hi2)"/></marker></defs>`;
  o+=`<g id="world" transform="translate(${view.x},${view.y}) scale(${view.k})">`;
  L.bands.forEach((b,i)=>{ o+=R(20,b.y0-56,L.totalW+40,b.h,{fill:i%2?'var(--band)':'var(--band2)',rx:8}); o+=T(34,b.y0-28,b.area.name,{fs:17,fw:700,fill:'var(--ink)'}); });
  L.depths.forEach(d=>{ const x=L.colX[d]; o+=T(x,PAD_Y-96,`Depth ${d}`,{fs:12,fw:600,fill:'var(--ink2)'}); o+=T(x,PAD_Y-78,DEPTH_NAMES[d]||'',{fs:15,fw:600,fill:'var(--ink)'}); o+=`<line x1="${x}" y1="${PAD_Y-68}" x2="${x+W}" y2="${PAD_Y-68}" stroke="var(--line)" stroke-width="1"/>`; });
  o+=`<g id="edges">`;
  edges.forEach((e,i)=>{ const d='M'+e.pts.map(p=>p.join(' ')).join(' L '); const col=e.back?'var(--edge2)':'var(--edge)'; const [sx,sy]=e.pts[0]; o+=`<g class="edge ${e.back?'back':''}" data-f="${e.from}" data-t="${e.to}"><path d="${d}" fill="none" stroke="${col}" stroke-width="${e.back?.9:1.1}" ${e.back?'stroke-dasharray="5 4"':e.ovl?'stroke-dasharray="2 3"':''} marker-end="url(#${e.back?'ar2':'ar'})"/><circle cx="${sx}" cy="${sy}" r="2.6" fill="${col}"/></g>`; });
  o+=`</g>`;
  L.list.forEach(s=>{ const p=L.pos[s.id]; o+=`<g class="scr ${selected===s.id?'sel':''}" data-id="${s.id}" transform="translate(${p.x},${p.y})">`;
    o+=`<rect class="frame" x="-1" y="-1" width="${W+2}" height="${H+2}" rx="6" fill="var(--frame)" stroke="${s.overlay?'var(--ink2)':'var(--line)'}" stroke-width="1.5" ${s.overlay?'stroke-dasharray="6 4"':''}/>`;
    o+=`<clipPath id="c-${s.id}"><rect x="0" y="0" width="${W}" height="${H}" rx="5"/></clipPath><g clip-path="url(#c-${s.id})">${screenSvg(s)}</g>`;
    if(s.shots.length>1) o+=`<g transform="translate(${W-8},8)">${R(-30,0,30,14,{fill:'var(--frame)',stroke:'var(--line)',rx:7})}${T(-15,7.5,'+'+(s.shots.length-1),{a:'middle',db:'middle',fs:9,fw:600,fill:'var(--ink)'})}</g>`;
    o+=`<circle cx="6" cy="${H+15}" r="3.5" fill="${stColor(s)}"/>`;
    o+=`<text x="16" y="${H+19}" font-size="12.5" fill="var(--ink)"><tspan font-weight="700">${esc(s.code)}</tspan><tspan dx="6" font-weight="500">${esc(s.name)}</tspan></text>`;
    let tags=[s.role]; if(s.overlay) tags.push('오버레이 · '+BY[s.base].name+' 위'); if(s.state) tags.push(s.state); tags.push(STATUS[s.status]);
    o+=T(16,H+33,tags.join('  ·  '),{fs:10,fill:'var(--ink2)'});
    o+=`</g>`; });
  o+=`<g id="pills">`;
  edges.forEach(e=>{ const col=e.back?'var(--edge2)':'var(--ink)'; const a=e.a.length>34? e.a.slice(0,33)+'…':e.a; o+=`<g class="pill" data-f="${e.from}" data-t="${e.to}" transform="translate(${e.lx},${e.ly})"><rect x="${-e.lw/2}" y="-9.5" width="${e.lw}" height="19" rx="9.5" fill="var(--frame)" stroke="var(--line)" stroke-width="0.8"/>${T(0,0,a,{a:'middle',db:'middle',fs:9.5,fw:400,fill:col})}</g>`; });
  o+=`</g></g>`;
  svg.innerHTML=o;
  svg.querySelectorAll('.scr').forEach(g=>{ g.addEventListener('click',ev=>{ ev.stopPropagation(); select(g.dataset.id); }); g.addEventListener('pointerenter',()=>{ if(!selected) applyFocus(g.dataset.id); }); g.addEventListener('pointerleave',()=>{ if(!selected) applyFocus(null); }); });
  applyFocus(selected);
}

/* 연결성 강조: 고른(또는 올린) 화면과 그에 닿는 선 · 라벨 · 이웃 화면만 살리고 나머지는 흐리게 */
function applyFocus(id){
  svg.classList.toggle('focus', !!id);
  const near=new Set(); if(id){ near.add(id); svg.querySelectorAll('.edge').forEach(g=>{ if(g.dataset.f===id) near.add(g.dataset.t); if(g.dataset.t===id) near.add(g.dataset.f); }); }
  svg.querySelectorAll('.scr').forEach(g=>{ const me=g.dataset.id===id, nb=!me&&near.has(g.dataset.id); g.classList.toggle('sel',me); g.classList.toggle('near',nb); g.classList.toggle('dim', !!id && !me && !nb); });
  svg.querySelectorAll('.edge, .pill').forEach(g=>{ const on=!!id && (g.dataset.f===id||g.dataset.t===id); const out=g.dataset.f===id; g.classList.toggle('on',on); g.classList.toggle('out',on&&out); g.classList.toggle('in',on&&!out); g.classList.toggle('dim', !!id && !on); const path=g.querySelector('path'); if(path){ path.setAttribute('marker-end', on? (out?'url(#arh)':'url(#arh2)') : (g.classList.contains('back')?'url(#ar2)':'url(#ar)')); } });
}

function applyView(){ const w=svg.querySelector('#world'); if(w) w.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`); }
function fit(){ const L=cur.L; const x0=0, y0=PAD_Y-130; const bw=L.totalW+60, bh=L.totalH-y0+40; const r=svg.getBoundingClientRect(); const k=Math.min(r.width/bw, r.height/bh, 1.6); view={k, x:(r.width-bw*k)/2 - x0*k, y:(r.height-bh*k)/2 - y0*k}; applyView(); }
function zoomAt(f,cx,cy){ const nk=Math.min(4,Math.max(.12,view.k*f)); view.x=cx-(cx-view.x)*(nk/view.k); view.y=cy-(cy-view.y)*(nk/view.k); view.k=nk; applyView(); }
svg.addEventListener('wheel',e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.deltaY<0?1.12:1/1.12, e.clientX-r.left, e.clientY-r.top); },{passive:false});
let drag=null; svg.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}; svg.setPointerCapture(e.pointerId); svg.classList.add('grabbing'); });
svg.addEventListener('pointermove',e=>{ if(!drag) return; view.x=drag.vx+(e.clientX-drag.x); view.y=drag.vy+(e.clientY-drag.y); applyView(); });
svg.addEventListener('pointerup',()=>{ drag=null; svg.classList.remove('grabbing'); });
svg.addEventListener('dblclick',e=>{ if(!e.target.closest('.scr')) fit(); });
document.getElementById('zin').onclick=()=>{ const r=svg.getBoundingClientRect(); zoomAt(1.25,r.width/2,r.height/2); };
document.getElementById('zout').onclick=()=>{ const r=svg.getBoundingClientRect(); zoomAt(1/1.25,r.width/2,r.height/2); };
document.getElementById('fit').onclick=fit;
window.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; const r=svg.getBoundingClientRect(); if(e.key==='+'||e.key==='=') zoomAt(1.2,r.width/2,r.height/2); else if(e.key==='-') zoomAt(1/1.2,r.width/2,r.height/2); else if(e.key==='0') fit(); else if(e.key==='Escape'){ if(lb.classList.contains('open')) lb.classList.remove('open'); else closePanel(); } else if(e.key.startsWith('Arrow')){ const d=40; if(e.key==='ArrowLeft') view.x+=d; if(e.key==='ArrowRight') view.x-=d; if(e.key==='ArrowUp') view.y+=d; if(e.key==='ArrowDown') view.y-=d; applyView(); } });
window.addEventListener('resize',fit);

/* ───────── 상세 패널 ───────── */
const panel=document.getElementById('panel'), pbody=document.getElementById('pbody'), lb=document.getElementById('lb'), lbimg=document.getElementById('lbimg');
lb.onclick=()=>lb.classList.remove('open');
function closePanel(){ panel.classList.remove('open'); selected=null; applyFocus(null); }
document.getElementById('pclose').onclick=closePanel;
function select(id, shotIdx=0){
  const s=BY[id]; selected=id; applyFocus(id);
  const incoming=S.flatMap(o=>o.exits.filter(e=>e.t===id).map(e=>({from:o,a:e.a})));
  const shot=s.shots[shotIdx]; const src=shot&&IMG[shot.c];
  const shotHtml= src? `<img class="shot" src="${src}" alt="${esc(s.code+' '+s.name)}" data-full="${src}">` : `<div class="shot none">${s.status==='plan'?'미구현 — 설계만 확정됨':'스크린샷 미갱신 — 캡쳐 예정'}</div>`;
  const variants= s.shots.length>1? `<div class="variants">${s.shots.map((v,i)=>`<button aria-pressed="${i===shotIdx}" data-v="${i}">${esc(v.l)}</button>`).join('')}</div>`:'';
  pbody.innerHTML=`<h2>${esc(s.code)} ${esc(s.name)}</h2>
   <div class="meta"><span class="st-${s.status}">${STATUS[s.status]}</span><span>Depth ${s.depth}</span><span>${esc(AREAS.find(a=>a.id===s.area).name)}</span><span>${esc(s.role)}</span>${s.overlay?`<span>오버레이 · ${esc(BY[s.base].name)} 위</span>`:''}${s.state?`<span>${esc(s.state)}</span>`:''}</div>
   ${shotHtml}${variants}
   <p style="margin-top:12px">${esc(s.desc)}</p>
   <h3>UI 요소</h3><ul>${s.ui.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>
   ${s.notes.length?`<h3>메모 · 와이어플로우와 다른 점</h3><ul>${s.notes.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`:''}
   <h3>나가는 전환</h3>${s.exits.map(e=>`<div class="exit"><b>${esc(e.a)}</b><button data-go="${e.t}">→ ${esc(BY[e.t].code)} ${esc(BY[e.t].name)}</button></div>`).join('')||'<p>없음</p>'}
   <h3>들어오는 전환</h3>${incoming.map(i=>`<div class="exit"><b>${esc(i.from.code)} ${esc(i.from.name)}</b><span style="color:var(--ink2)">${esc(i.a)}</span></div>`).join('')||'<p>없음</p>'}`;
  pbody.querySelectorAll('[data-go]').forEach(b=>{ b.onmouseenter=()=>{ const g=svg.querySelector(`.scr[data-id="${b.dataset.go}"]`); if(g) g.classList.add('peek'); }; b.onmouseleave=()=>{ svg.querySelectorAll('.scr.peek').forEach(g=>g.classList.remove('peek')); }; });
  pbody.querySelectorAll('[data-go]').forEach(b=> b.onclick=()=>{ const t=b.dataset.go; if(!cur.ids.includes(t)){ cur=TABS[0]; draw(); fit(); } select(t); const p=cur.L.pos[t]; if(p){ const r=svg.getBoundingClientRect(); view.x=r.width/2-(p.x+W/2)*view.k; view.y=r.height/2-(p.y+H/2)*view.k; applyView(); } });
  pbody.querySelectorAll('[data-v]').forEach(b=> b.onclick=()=> select(id, +b.dataset.v));
  const im=pbody.querySelector('img.shot'); if(im) im.onclick=()=>{ lbimg.src=im.dataset.full; lb.classList.add('open'); };
  panel.classList.add('open');
}

try{ const t=localStorage.getItem('sls-tab'); const f=TABS.find(x=>x.id===t); if(f) cur=f; }catch(e){}
draw(); fit();
</script>
